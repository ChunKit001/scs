spring:
  profiles:
    # IDE / mvn spring-boot:run 默认；可用 SPRING_PROFILES_ACTIVE 或 --spring.profiles.active / start.sh 覆盖
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    user:
      name: ${SCS_SECURITY_USER:scs}
      password: ${SCS_SECURITY_PASSWORD:scs-change-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    encoding: UTF-8

# 默认关：无 MySQL / Redis 也能起脚手架；需要时再开
scs:
  db:
    enabled: ${SCS_DB_ENABLED:false}
  redis:
    enabled: ${SCS_REDIS_ENABLED:false}

mybatis-plus:
  mapper-locations: classpath*:mybatis/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 业务自行赋值主键（见 CustomerAddCmdExe）
      id-type: input

corn:
  ping: "0 0/1 * * * *"

server:
  port: 58080
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
